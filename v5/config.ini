; screenshot_capture.ini
; 截图程序配置文件

[General]
; 截图保存目录 (默认: C:\screenshots)
ScreenshotDir=C:\screenshots

; 文件命名格式 (默认: YYYYMMDD HH24-MI-SS)
; 可用格式:
;   timestamp - 时间戳格式
;   datetime  - 日期时间格式
NameFormat=datetime

; 是否在后台运行 (true/false)
BackgroundMode=false

; 截图时是否播放提示音
PlaySound=true

; 截图成功时是否闪烁托盘图标
FlashIcon=true

; 日志最大显示条数
MaxLogEntries=10000

[Hotkey]
; 热键设置 (默认: Ctrl+PrtSc)
; 修饰键: Ctrl, Alt, Shift, Win
; 按键: PrtSc, F1-F12 等
Modifier=Ctrl
Key=PrtSc

[Advanced]
; 截图格式: BMP, PNG (PNG需要额外库)
ImageFormat=BMP

; JPEG质量 (仅PNG/JPEG有效，1-100)
Quality=90